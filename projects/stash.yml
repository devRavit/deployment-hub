name: stash
type: apprunner
region: ap-northeast-1

aws:
  ecr_role: stash-apprunner-ecr-role
  instance_role: AppRunnerStashInstanceRole

apprunner:
  service_name: stash
  port: 9090
  cpu: "0.25 vCPU"
  memory: "0.5 GB"
  health_check:
    path: /health
    interval: 10
    timeout: 5
    healthy_threshold: 1
    unhealthy_threshold: 5
  env:
    JAVA_TOOL_OPTIONS: "-Xmx256m -XX:+UseG1GC"


name: stash
source_repo: devRavit/stash
type: apprunner

apprunner:
  service_name: stash
  port: 9090
  cpu: "0.25 vCPU"
  memory: "0.5 GB"
  health_check:
    path: /health
    interval: 10
    timeout: 5
    healthy_threshold: 1
    unhealthy_threshold: 5
  env:
    JAVA_TOOL_OPTIONS: "-Xmx256m -XX:+UseG1GC"

secrets:
  - env: SPRING_DATA_MONGODB_URI
    secret: prod/stash
    key: SPRING_DATA_MONGODB_URI

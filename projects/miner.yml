name: miner
type: lightsail
region: ap-northeast-2

aws:
  secrets_manager_id: production/miner

# ECR 이미지 보관 정책 — 배포(deploy)는 :VERSION + :latest push, 실행은 :latest.
# keep_count 만큼 tagged 이미지(latest + 직전들)만 보관, 나머지 + untagged 는 lifecycle 로 만료.
# rollback(rollback.yml) 은 보관된 직전 버전으로만 가능.
ecr:
  lifecycle:
    keep_count: 2

lightsail:
  instance_name: miner
  container_name: miner
  # Lightsail 인스턴스에서 외부로 노출되는 포트 (Lightsail firewall 도 동일 포트 OPEN 되어 있어야 함)
  host_port: 80
  # 컨테이너 내부에서 Spring 이 listen 하는 포트
  container_port: 8080
  health_check:
    path: /health
    interval: 10
    timeout: 5
    retries: 3
  env:
    SPRING_PROFILES_ACTIVE: production
    JAVA_TOOL_OPTIONS: "-Xmx1024m -XX:+UseG1GC"

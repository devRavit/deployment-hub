name: miner
type: lightsail
region: ap-northeast-2

aws:
  secrets_manager_id: production/miner

# ECR 이미지 보관 정책 — 배포(deploy)는 :VERSION + :latest push, 실행은 :latest.
# keep_count 만큼 tagged 이미지(latest + 직전들)만 보관, 나머지 + untagged 는 lifecycle 로 만료.
# rollback(rollback.yml) 은 보관된 직전 버전으로만 가능.
ecr:
  lifecycle:
    keep_count: 2

lightsail:
  instance_name: miner
  container_name: miner
  # Caddy reverse proxy 뒤에 위치 — host_port 는 docker network 안 통신용 (외부 노출 X).
  # 외부는 https://miner.ravit.run (443) → Caddy → miner:8080
  host_port: 8080
  container_port: 8080
  health_check:
    path: /health
    interval: 10
    timeout: 5
    retries: 3
  env:
    SPRING_PROFILES_ACTIVE: production
    JAVA_TOOL_OPTIONS: "-Xmx1024m -XX:+UseG1GC"
    # 단타 트랙 대상 시장(#1181, 2026-07-13 사용자 지시로 US 개방) — 발굴·진입 스케줄러가 US 정규장(22:30~05:00 KST)에도 발화.
    MINER_DAYTRADE_MARKETS: "KR" # US 단타 차단(운영자 지시 2026-07-16) — 재개방은 명시 지시로만

  # 인스턴스당 공유 Caddy 가 자동 부트스트랩. Caddyfile snippet 은 sites.d/miner.caddy.
  # Let's Encrypt HTTP-01 challenge 로 인증서 발급 → 60일마다 자동 갱신.
  reverse_proxy:
    enabled: true
    domain: miner.ravit.run
    tls:
      provider: letsencrypt
      email: devravit@gmail.com

name: PR body

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  required-sections:
    runs-on: ubuntu-latest
    steps:
      - name: Check 10 required sections
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          required=(
            "작업 배경"
            "의사결정"
            "적용 패턴"
            "작업 방향"
            "기대 효과"
            "개발 방법"
            "테스트 커버리지 방향"
            "잠재 이슈"
            "확장 고려"
            "문서 갱신"
          )
          missing=()
          for section in "${required[@]}"; do
            grep -qF "$section" <<<"$BODY" || missing+=("$section")
          done
          if (( ${#missing[@]} > 0 )); then
            printf '❌ PR body missing required sections:\n'
            printf '  - %s\n' "${missing[@]}"
            echo
            echo "see README / miner docs/workflow/pr-process.md (PR 본문 10 섹션)"
            exit 1
          fi
          echo "✅ PR body has all required sections"

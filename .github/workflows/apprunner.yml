name: Deploy to App Runner

on:
  repository_dispatch:
    types: [deploy-apprunner]

concurrency:
  group: deploy-${{ github.event.client_payload.project }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployment-hub
        uses: actions/checkout@v4

      - name: Validate project
        id: validate
        run: |
          PROJECT="${{ github.event.client_payload.project }}"
          CONFIG="projects/${PROJECT}.yml"

          if [ ! -f "$CONFIG" ]; then
            echo "::error::Unknown project: $PROJECT"
            exit 1
          fi

          echo "config_path=$CONFIG" >> $GITHUB_OUTPUT
          echo "project=$PROJECT" >> $GITHUB_OUTPUT

      - name: Load project config
        id: config
        run: |
          CONFIG="${{ steps.validate.outputs.config_path }}"

          echo "name=$(yq '.name' $CONFIG)" >> $GITHUB_OUTPUT
          echo "service_name=$(yq '.apprunner.service_name' $CONFIG)" >> $GITHUB_OUTPUT
          echo "port=$(yq '.apprunner.port' $CONFIG)" >> $GITHUB_OUTPUT
          echo "cpu=$(yq '.apprunner.cpu' $CONFIG)" >> $GITHUB_OUTPUT
          echo "memory=$(yq '.apprunner.memory' $CONFIG)" >> $GITHUB_OUTPUT
          echo "health_path=$(yq '.apprunner.health_check.path' $CONFIG)" >> $GITHUB_OUTPUT
          echo "health_interval=$(yq '.apprunner.health_check.interval' $CONFIG)" >> $GITHUB_OUTPUT
          echo "health_timeout=$(yq '.apprunner.health_check.timeout' $CONFIG)" >> $GITHUB_OUTPUT
          echo "health_healthy=$(yq '.apprunner.health_check.healthy_threshold' $CONFIG)" >> $GITHUB_OUTPUT
          echo "health_unhealthy=$(yq '.apprunner.health_check.unhealthy_threshold' $CONFIG)" >> $GITHUB_OUTPUT

          # Extract environment variables as JSON (use heredoc for multiline)
          echo "env_vars<<EOF" >> $GITHUB_OUTPUT
          yq -o=json -I=0 '.apprunner.env // {}' $CONFIG >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT


      - name: Create GitHub Deployment
        id: deployment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PAT }}
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: 'devRavit',
              repo: '${{ steps.validate.outputs.project }}',
              ref: '${{ github.event.client_payload.sha }}',
              environment: 'production',
              auto_merge: false,
              required_contexts: [],
              description: 'Deploy v${{ github.event.client_payload.version }} to AWS App Runner'
            });
            return deployment.data.id;
          result-encoding: string

      - name: Set Deployment In Progress
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PAT }}
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: 'devRavit',
              repo: '${{ steps.validate.outputs.project }}',
              deployment_id: ${{ steps.deployment.outputs.result }},
              state: 'in_progress',
              description: 'Deploying to AWS App Runner...'
            });

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Resolve secrets ARNs
        id: secrets
        env:
          PROJECT: ${{ steps.validate.outputs.project }}
        run: |
          # Build RuntimeEnvironmentSecrets from production/{project} secret
          RUNTIME_SECRETS="{}"
          SECRET_ID="production/${PROJECT}"

          # Check if secret exists
          if aws secretsmanager describe-secret --secret-id "$SECRET_ID" &>/dev/null; then
            SECRET_ARN=$(aws secretsmanager describe-secret --secret-id "$SECRET_ID" --query 'ARN' --output text)

            # Get all keys from the secret
            SECRET_KEYS=$(aws secretsmanager get-secret-value --secret-id "$SECRET_ID" --query 'SecretString' --output text | jq -r 'keys[]')

            for KEY in $SECRET_KEYS; do
              # Convert spring.mongodb.uri -> SPRING_MONGODB_URI
              ENV_NAME=$(echo "$KEY" | tr '.' '_' | tr '[:lower:]' '[:upper:]')
              FULL_ARN="${SECRET_ARN}:${KEY}::"
              RUNTIME_SECRETS=$(echo "$RUNTIME_SECRETS" | jq -c ". + {\"$ENV_NAME\": \"$FULL_ARN\"}")
            done

            echo "Secret $SECRET_ID found with keys: $SECRET_KEYS"
          else
            echo "No secret found at $SECRET_ID, skipping secrets injection"
          fi

          echo "runtime_secrets<<EOF" >> $GITHUB_OUTPUT
          echo "$RUNTIME_SECRETS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Check if App Runner service exists
        id: check-service
        env:
          SERVICE_NAME: ${{ steps.config.outputs.service_name }}
        run: |
          SERVICE_ARN=$(aws apprunner list-services --query "ServiceSummaryList[?ServiceName=='$SERVICE_NAME'].ServiceArn" --output text)
          if [ -z "$SERVICE_ARN" ] || [ "$SERVICE_ARN" == "None" ]; then
            echo "exists=false" >> $GITHUB_OUTPUT
          else
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "arn=$SERVICE_ARN" >> $GITHUB_OUTPUT
          fi

      - name: Create App Runner service
        if: steps.check-service.outputs.exists == 'false'
        id: create-service
        env:
          IMAGE_URI: ${{ github.event.client_payload.image_uri }}
          SERVICE_NAME: ${{ steps.config.outputs.service_name }}
          PORT: ${{ steps.config.outputs.port }}
          CPU: ${{ steps.config.outputs.cpu }}
          MEMORY: ${{ steps.config.outputs.memory }}
          HEALTH_PATH: ${{ steps.config.outputs.health_path }}
          HEALTH_INTERVAL: ${{ steps.config.outputs.health_interval }}
          HEALTH_TIMEOUT: ${{ steps.config.outputs.health_timeout }}
          HEALTH_HEALTHY: ${{ steps.config.outputs.health_healthy }}
          HEALTH_UNHEALTHY: ${{ steps.config.outputs.health_unhealthy }}
          ENV_VARS: ${{ steps.config.outputs.env_vars }}
          RUNTIME_SECRETS: ${{ steps.secrets.outputs.runtime_secrets }}
          ECR_ROLE_ARN: ${{ secrets.APP_RUNNER_ECR_ROLE_ARN }}
          INSTANCE_ROLE_ARN: ${{ secrets.APP_RUNNER_INSTANCE_ROLE_ARN }}
        run: |
          # Build ImageConfiguration
          IMAGE_CONFIG="{\"Port\": \"$PORT\""

          # Add environment variables if present
          if [ "$ENV_VARS" != "{}" ] && [ "$ENV_VARS" != "null" ]; then
            IMAGE_CONFIG="$IMAGE_CONFIG, \"RuntimeEnvironmentVariables\": $ENV_VARS"
          fi

          # Add secrets if present
          if [ "$RUNTIME_SECRETS" != "{}" ] && [ "$RUNTIME_SECRETS" != "null" ]; then
            IMAGE_CONFIG="$IMAGE_CONFIG, \"RuntimeEnvironmentSecrets\": $RUNTIME_SECRETS"
          fi

          IMAGE_CONFIG="$IMAGE_CONFIG}"

          SERVICE_ARN=$(aws apprunner create-service \
            --service-name "$SERVICE_NAME" \
            --source-configuration "{
              \"AuthenticationConfiguration\": {\"AccessRoleArn\": \"$ECR_ROLE_ARN\"},
              \"ImageRepository\": {
                \"ImageIdentifier\": \"$IMAGE_URI\",
                \"ImageRepositoryType\": \"ECR\",
                \"ImageConfiguration\": $IMAGE_CONFIG
              },
              \"AutoDeploymentsEnabled\": false
            }" \
            --instance-configuration "{\"Cpu\": \"$CPU\", \"Memory\": \"$MEMORY\", \"InstanceRoleArn\": \"$INSTANCE_ROLE_ARN\"}" \
            --health-check-configuration "{\"Protocol\": \"HTTP\", \"Path\": \"$HEALTH_PATH\", \"Interval\": $HEALTH_INTERVAL, \"Timeout\": $HEALTH_TIMEOUT, \"HealthyThreshold\": $HEALTH_HEALTHY, \"UnhealthyThreshold\": $HEALTH_UNHEALTHY}" \
            --query 'Service.ServiceArn' --output text)
          echo "arn=$SERVICE_ARN" >> $GITHUB_OUTPUT

      - name: Deploy to existing App Runner
        if: steps.check-service.outputs.exists == 'true'
        run: |
          aws apprunner start-deployment --service-arn ${{ steps.check-service.outputs.arn }}

      - name: Set Deployment Success
        if: success()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PAT }}
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: 'devRavit',
              repo: '${{ steps.validate.outputs.project }}',
              deployment_id: ${{ steps.deployment.outputs.result }},
              state: 'success',
              description: 'Deployed v${{ github.event.client_payload.version }} to production'
            });

      - name: Set Deployment Failure
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PAT }}
          script: |
            await github.rest.repos.createDeploymentStatus({
              owner: 'devRavit',
              repo: '${{ steps.validate.outputs.project }}',
              deployment_id: ${{ steps.deployment.outputs.result }},
              state: 'failure',
              description: 'Deployment failed'
            });

      - name: Create GitHub Release
        if: success()
        uses: actions/github-script@v7
        env:
          CHANGELOG: ${{ github.event.client_payload.changelog }}
        with:
          github-token: ${{ secrets.PAT }}
          script: |
            const version = '${{ github.event.client_payload.version }}';
            const tagName = `v${version}`;
            const project = '${{ steps.validate.outputs.project }}';
            const sha = '${{ github.event.client_payload.sha }}';

            // Check if tag already exists
            try {
              await github.rest.git.getRef({
                owner: 'devRavit',
                repo: project,
                ref: `tags/${tagName}`
              });
              console.log(`Tag ${tagName} already exists, skipping release creation`);
              return;
            } catch (e) {
              // Tag doesn't exist, create release
            }

            const changelog = process.env.CHANGELOG || '';
            const footer = `\n---\n**Tag:** ${tagName}\n**Commit:** ${sha.substring(0, 7)}`;
            const body = changelog ? changelog + footer : `Deployed to production via AWS App Runner.${footer}`;

            await github.rest.repos.createRelease({
              owner: 'devRavit',
              repo: project,
              tag_name: tagName,
              name: tagName,
              body: body,
              draft: false,
              prerelease: false,
              target_commitish: sha
            });
